name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q

  minimum-dependencies:
    # The floor in requirements.txt is a claim about what works; without this it
    # is only ever tested at whatever the latest release happens to be (audit O02).
    name: oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the lower bounds
        run: |
          python -m pip install --upgrade pip
          pip install 'aiohttp==3.10.*' 'python-telegram-bot==21.6' \
                      'python-dotenv==1.0.*' 'httpx[socks]==0.27.*' \
                      'pytest>=8' 'pytest-asyncio>=0.24'
      - run: pytest -q

  image:
    name: docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: max2tg:ci
      - name: Import every module inside the image
        # Catches the class of failure the glibc→musl copy used to hide: a
        # dependency that installs fine but cannot actually be loaded at runtime.
        run: |
          docker run --rm --entrypoint python max2tg:ci -c "
          import aiohttp, telegram, httpx, dotenv
          import app.main, app.max_client, app.store, app.pipeline
          import app.tg_handler, app.tg_outbound, app.net, app.healthcheck
          print('image imports OK', aiohttp.__version__, telegram.__version__)
          "
      - name: Health probe reports "not ready" with no state
        run: |
          set +e
          docker run --rm --entrypoint python max2tg:ci -m app.healthcheck
          test $? -eq 1

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit --strict
